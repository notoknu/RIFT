name: Android preview verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: Run nineteen isolated SQLite/checkpoint/raster/Keystore tests on a disposable API 35 emulator (uses runner time)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ensure Android SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: npm ci
      - run: npm run android:prepare
      - run: npm run test:android-shell && npm run test:native-policy && npm run test:personal-workspace && npm run test:file-export && npm run test:device-reads
      - name: Build app, compile device tests and lint
        run: bash android/gradlew -p android --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Optional disposable emulator setup
        if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name rift-ci --package 'system-images;android-35;google_apis;x86_64' --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd rift-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/rift-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
      - name: Optional real Android SQLite instrumentation execution
        if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
        run: bash android/gradlew -p android --no-daemon connectedDebugAndroidTest
      - name: Upload debug build and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RIFT-debug-preview-and-test-evidence
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
