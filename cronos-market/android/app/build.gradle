plugins { id 'com.android.application' }
def endpoint = providers.gradleProperty('riftOrigin').orElse('https://rift-q6qs.onrender.com').get()
if (endpoint && !(endpoint ==~ /^https:\/\/[a-zA-Z0-9.-]+(:443)?$/)) throw new GradleException('riftOrigin must be an exact HTTPS origin without path, credentials or query')
android {
    namespace 'io.rift.cronos'
    compileSdk 35
    defaultConfig {
        applicationId 'io.rift.cronos'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 21
        versionName '0.19.0-launch-workspace-preview'
        buildConfigField 'String', 'RIFT_ORIGIN', '"' + endpoint + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-debug' }
        release { minifyEnabled false; debuggable false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation('org.web3j:crypto:4.12.3') { transitive = false }
    implementation 'org.web3j:utils:4.12.3'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
